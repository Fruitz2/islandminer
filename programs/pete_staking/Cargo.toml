[package]
name = "pete_staking"
version = "0.1.0"
description = "SOL reward staking program for Palm Beach Pete."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pete_staking"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
